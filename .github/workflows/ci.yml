name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 black isort bandit

      - name: Checagem de Formatação (black & isort)
        run: |
          black --check backend/app
          isort --check-only backend/app

      - name: Análise Estática de Código (flake8)
        run: |
          flake8 backend/app --config=.flake8

      - name: Auditoria de Segurança Estática (bandit)
        run: |
          bandit -r backend/app -lll

      - name: Validar Sintaxe e Compilação Python
        run: |
          python -m compileall backend/app backend/tests

      - name: Executar Testes Automatizados e Coverage (pytest)
        env:
          POSTGRES_PASSWORD: test_ci_db_pass_123
          ENVIRONMENT: test
        run: |
          PYTHONPATH=backend pytest --cov=backend/app --cov-fail-under=50 backend/tests/

  frontend-checks:
    name: Frontend Build, Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Instalar Dependências do Frontend
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Validação de Tipagem TypeScript (tsc)
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Análise Estática de Código (ESLint)
        working-directory: frontend
        run: |
          npm run lint

      - name: Compilação de Produção (Next.js Build)
        working-directory: frontend
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Executar Testes Automatizados e Coverage (Vitest)
        working-directory: frontend
        run: |
          npm run test:coverage
