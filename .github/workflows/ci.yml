name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Padrão seguro para a raiz: tudo apenas leitura (Princípio do Menor Privilégio)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install -r scripts/requirements-ci-tools.txt

      - name: Checagem de Formatação (black & isort)
        run: |
          black --check backend/app
          isort --check-only backend/app

      - name: Análise Estática de Código (flake8)
        run: |
          flake8 backend/app --config=.flake8

      - name: Checagem de Tipagem Estática (mypy)
        run: |
          mypy backend/app --config-file=pyproject.toml

      - name: Auditoria de Segurança Estática (bandit)
        run: |
          bandit -r backend/app -q

      - name: Auditoria de Dependências Python (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt

      - name: Validar Sintaxe e Compilação Python
        run: |
          python -m compileall backend/app backend/tests

      - name: Executar Testes Automatizados e Coverage (pytest)
        env:
          POSTGRES_PASSWORD: test_ci_db_pass_123
          ENVIRONMENT: test
        run: |
          PYTHONPATH=backend pytest --cov=backend/app --cov-branch --cov-fail-under=85 backend/tests/

  etl-checks:
    name: ETL Pipelines Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências do ETL
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r etl/requirements.txt -r etl/requirements-dev.txt

      - name: Validar Compilação do ETL
        run: |
          python -m compileall etl/

      - name: Executar Testes Automatizados do ETL (pytest)
        env:
          POSTGRES_PASSWORD: test_ci_db_pass_123
          ENVIRONMENT: test
        run: |
          PYTHONPATH=backend:. pytest -q etl/tests/

  frontend-checks:
    name: Frontend Build, Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: frontend
        run: |
          npm ci

      - name: Auditoria de Dependências do Frontend (npm audit)
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=high

      - name: Validação de Tipagem TypeScript (tsc)
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Análise Estática de Código (ESLint)
        working-directory: frontend
        run: |
          npm run lint

      - name: Compilação de Produção (Next.js Build)
        working-directory: frontend
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Executar Testes Automatizados e Coverage (Vitest)
        working-directory: frontend
        run: |
          npm run test:coverage

  security-scan:
    name: Security Vulnerability Scan (Trivy & CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Permissão de escrita de segurança isolada exclusivamente para este job
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Executar Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload dos resultados do Trivy para o GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: "python, javascript-typescript"

      - name: Analisar Código com CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "codeql"
