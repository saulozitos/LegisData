name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Token do GITHUB_TOKEN apenas com leitura (princípio do menor privilégio)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx

      - name: Validar Sintaxe e Compilação Python
        run: |
          python -m compileall backend/app backend/tests

      - name: Executar Testes Automatizados e Coverage (pytest)
        run: |
          PYTHONPATH=backend pytest --cov=backend/app --cov-fail-under=50 backend/tests/

  frontend-checks:
    name: Frontend Build, Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: frontend
        run: |
          npm ci

      - name: Validação de Tipagem TypeScript (tsc)
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Análise Estática de Código (ESLint)
        working-directory: frontend
        run: |
          npm run lint

      - name: Compilação de Produção (Next.js Build)
        working-directory: frontend
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Executar Testes Automatizados e Coverage (Vitest)
        working-directory: frontend
        run: |
          npm run test:coverage
