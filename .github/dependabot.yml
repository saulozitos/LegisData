version: 2
updates:
  # Backend Python (Pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # ETL Pipelines Python (Pip)
  - package-ecosystem: "pip"
    directory: "/etl"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      etl-dependencies:
        patterns:
          - "*"

  # Frontend Next.js (NPM)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # O eslint-config-next (typescript-eslint) ainda não aceita o TypeScript 7: o lint quebra. Tirar esta regra
      # quando o eslint-config-next passar a aceitá-lo.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"

  # Dockerfiles
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
