services:
  postgres:
    image: postgres:16-alpine
    container_name: politica_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-politica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-politica_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-politica_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-politica_user} -d ${POSTGRES_DB:-politica_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: politica_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-politica_user}:${POSTGRES_PASSWORD:-politica_secret_123}@postgres:5432/${POSTGRES_DB:-politica_db}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./etl/data:/etl_data

volumes:
  postgres_data:
