services:
  postgres:
    image: postgres:16-alpine
    container_name: politica_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-politica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-politica_db}
    ports:
      # Exposição estritamente em localhost para auditoria de segurança (evita acesso externo)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-politica_user} -d ${POSTGRES_DB:-politica_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: politica_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-politica_user}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/${POSTGRES_DB:-politica_db}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      # Restringido estritamente ao loopback local (127.0.0.1)
      - "127.0.0.1:8000:8000"
    volumes:
      # Apenas dados do ETL em modo somente leitura (sem montagem de código do disco)
      - ./etl/data:/etl_data:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: politica_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - INTERNAL_BACKEND_URL=http://backend:8000
      - PORT=3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:

